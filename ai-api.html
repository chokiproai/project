<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AI API — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #f5f5f7;
      --bg-card: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #86868b;
      --apple-blue: #0071e3;
      --border-card: rgba(0, 0, 0, 0.06);
      --shadow-card: 0 12px 36px rgba(0, 0, 0, 0.06);
    }

    body.dark {
      --bg-page: #000000;
      --bg-card: #141416;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73;
      --apple-blue: #0071e3;
      --border-card: rgba(255, 255, 255, 0.08);
      --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg-page);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      display: grid;
      place-items: center;
      color: var(--text-primary);
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .api-card {
      max-width: 440px;
      width: 100%;
      border-radius: 28px;
      padding: 40px 34px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .chip-icon {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(145deg, #1d1d1f, #000000);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2997ff;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #ff9f0a;
    }

    h3 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .source-row {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .source-row a {
      color: #2997ff;
      text-decoration: none;
      font-weight: 500;
    }

    .source-row a:hover {
      text-decoration: underline;
    }

    .btn-apple {
      margin-top: 6px;
      background: var(--apple-blue);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      padding: 11px 32px;
      border-radius: 980px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-apple:hover {
      background: #0077ed;
      transform: scale(1.03);
    }
  </style>
</head>

<body class="dark">
  <div class="api-card" role="group" aria-labelledby="card-title">
    <div class="chip-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
        <rect x="9" y="9" width="6" height="6"/>
        <path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>
      </svg>
    </div>

    <div>
      <div class="eyebrow" data-i18n="api.status">Unified AI Gateway • 2024</div>
      <h3 id="card-title" data-i18n="api.title">AI API.</h3>
    </div>

    <p data-i18n="api.desc">High-performance unified API gateway for LLM text, image generation, and intelligent workflows.</p>

    <div class="source-row">
      <span data-i18n="api.source">Powered by</span>
      <a href="https://github.com/QuantumNous/new-api" target="_blank" rel="noopener noreferrer">NewAPI ›</a>
    </div>

    <a href="https://oneapiadm.onrender.com" target="_blank" rel="noopener noreferrer" class="btn-apple">
      <span data-i18n="api.start">Launch Console</span>
    </a>
  </div>

  <script>
    const translations = {
      en: {
        "api.status": "Unified AI Gateway • 2024",
        "api.title": "AI API.",
        "api.desc": "High-performance unified API gateway for LLM text, image generation, and intelligent workflows.",
        "api.source": "Powered by",
        "api.start": "Launch Console"
      },
      vi: {
        "api.status": "Cổng AI Hợp nhất • 2024",
        "api.title": "AI API.",
        "api.desc": "Cổng kết nối API hiệu năng cao cho mô hình ngôn ngữ lớn, tạo sinh hình ảnh và tác vụ thông minh.",
        "api.source": "Phát triển trên",
        "api.start": "Mở Bảng điều khiển"
      }
    };

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.remove('dark');
      } else {
        document.body.classList.add('dark');
      }
    }

    function applyLang(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) applyTheme(savedTheme);

    const savedLang = localStorage.getItem('language');
    if (savedLang) applyLang(savedLang);

    window.addEventListener('message', (e) => {
      if (typeof e.data === 'string') {
        if (e.data.startsWith('theme:')) {
          applyTheme(e.data.split(':')[1]);
        } else if (e.data.startsWith('lang:')) {
          applyLang(e.data.split(':')[1]);
        }
      }
    });
  </script>
</body>

</html>
